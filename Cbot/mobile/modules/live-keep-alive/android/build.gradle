plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.livekeepalive'
version = '1.0.0'

android {
  namespace "expo.modules.livekeepalive"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.16.0"
}
