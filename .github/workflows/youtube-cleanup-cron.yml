name: Daily 30-Day YouTube Video Cleanup

on:
  schedule:
    # Run every 2 hours throughout the day
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  cleanup-youtube-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 30-Day YouTube Video Expiry Cron Endpoint
        run: |
          echo "Triggering CBOT World Daily 30-Day YouTube Cleanup..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "https://www.cbotworld.com/api/cron/expire-youtube-videos?secret=cbot_cron_secret_2026")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Cron endpoint returned status $HTTP_STATUS"
            exit 1
          fi
